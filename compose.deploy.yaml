name: needex-fe

services:
  fe:
    build:
      context: .
    restart: unless-stopped
    environment:
      TASKVIEW_BE_URL: ${TASKVIEW_BE_URL:?TASKVIEW_BE_URL is required}
    ports:
      - "${FE_BIND_ADDRESS:-0.0.0.0}:${FE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
